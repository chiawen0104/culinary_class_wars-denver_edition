<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Angel &amp; Mortal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4efe4; --panel: #fffdf8; --panel-2: #f8f4ea; --line: #e2d9c6; --line-strong: #cfc4ad;
      --ink: #161513; --white: #fff; --muted: #7a7366; --red: #c0392b;
      --serif: "Noto Serif TC", serif; --sans: "Noto Sans TC", system-ui, sans-serif;
      --shadow: 0 1px 2px rgba(40,32,16,.06), 0 8px 24px rgba(40,32,16,.06);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.6; min-height: 100vh; -webkit-font-smoothing: antialiased; }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; border: 1.5px solid var(--line-strong); background: var(--panel); border-radius: 999px; padding: 9px 20px; font-weight: 500; transition: transform .1s, border-color .15s; }
    button:hover:not(:disabled) { border-color: var(--ink); }
    button:active:not(:disabled) { transform: scale(.97); }
    button:disabled { opacity: .35; cursor: not-allowed; }
    button.primary { background: var(--ink); color: var(--white); border-color: var(--ink); font-weight: 700; }
    button.big { padding: 13px 30px; font-size: 1.05rem; }
    button.ghost { background: transparent; }
    input[type=text] { width: 100%; background: var(--white); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; outline: none; }
    input[type=text]:focus { border-color: var(--ink); box-shadow: 0 0 0 4px rgba(22,21,19,.08); }

    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--line); }
    header .t { font-family: var(--serif); font-weight: 900; font-size: 1.2rem; }
    header .t small { display: block; font-family: var(--sans); font-weight: 400; font-size: .75rem; color: var(--muted); letter-spacing: .1em; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px 60px; }
    h1 { font-family: var(--serif); font-weight: 900; font-size: 1.7rem; margin: 0 0 4px; }
    .lead { color: var(--muted); margin: 0 0 18px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
    .names { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .names label { display: flex; align-items: center; gap: 8px; }
    .names span { width: 18px; text-align: right; color: var(--muted); font-size: .85rem; flex: none; }
    .actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
    .error { color: var(--red); margin-top: 10px; text-align: center; }
    .who { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .who button { padding: 18px 10px; border-radius: 16px; font-family: var(--serif); font-weight: 900; font-size: 1.15rem; position: relative; }
    .who button.done { background: var(--panel-2); color: var(--muted); font-weight: 700; }
    .who button.done::after { content: "已抽 ✓"; display: block; font-family: var(--sans); font-size: .75rem; font-weight: 500; }
    .progress { text-align: center; color: var(--muted); margin-bottom: 14px; }
    .progress b { color: var(--ink); }

    .reveal { position: fixed; inset: 0; z-index: 10; background: radial-gradient(circle at 50% 25%, #34312c, var(--ink) 70%); color: var(--white);
      display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; animation: fade .3s ease both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .reveal .box { max-width: 440px; width: 100%; }
    .reveal .hi { font-family: var(--serif); font-size: 1.1rem; opacity: .75; }
    .envelope { margin: 24px auto; width: 100%; max-width: 340px; aspect-ratio: 4/3; border-radius: 20px; border: 2px dashed rgba(255,255,255,.45);
      display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: background .2s; }
    .envelope:hover { background: rgba(255,255,255,.06); }
    .envelope .q { font-family: var(--serif); font-weight: 900; font-size: 4rem; line-height: 1; }
    .envelope.open { cursor: default; border-style: solid; background: var(--white); color: var(--ink); animation: pop .5s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
    .envelope .label { font-size: .9rem; opacity: .7; }
    .envelope .name { font-family: var(--serif); font-weight: 900; font-size: clamp(2.4rem, 12vw, 3.6rem); line-height: 1.2; margin-top: 4px; }
    .reveal .tip { opacity: .7; font-size: .9rem; }
    .reveal button.primary { background: var(--white); color: var(--ink); border-color: var(--white); width: 100%; max-width: 340px; }
    .note { color: var(--muted); font-size: .85rem; text-align: center; margin-top: 8px; }
    @media (max-width: 480px) { .names { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div class="t">小主人抽籤<small>ANGEL &amp; MORTAL</small></div>
    <button class="ghost" onclick="App.reset()">↺ 重來</button>
  </header>
  <main id="app"></main>

  <script>
  (() => {
    'use strict';
    const KEY = 'little-master-v1';
    const N = 8;
    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const rand = (n) => { try { return crypto.getRandomValues(new Uint32Array(1))[0] % n; } catch (e) { return Math.floor(Math.random() * n); } };

    // Random derangement: nobody gets themselves.
    function derange(n) {
      while (true) {
        const a = [...Array(n).keys()];
        for (let i = n - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
        if (a.every((v, i) => v !== i)) return a;
      }
    }

    const fresh = () => ({ names: Array(N).fill(''), target: null, seen: [], showing: null, opened: false });
    let s;
    try { s = Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) { s = fresh(); }
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} };
    let error = '';

    function render() {
      const app = $('#app');
      if (!s.target) {
        app.innerHTML = `
          <h1>輸入 8 個人的名字</h1>
          <p class="lead">每個人會抽到一位「小主人」，不會抽到自己。抽到後要偷偷照顧他，不能說出去！</p>
          <div class="card">
            <div class="names">
              ${s.names.map((n, i) => `<label><span>${i + 1}</span><input type="text" value="${esc(n)}" placeholder="名字" oninput="App.setName(${i}, this.value)"></label>`).join('')}
            </div>
            ${error ? `<div class="error">${esc(error)}</div>` : ''}
            <div class="actions"><button class="primary big" onclick="App.start()">🎲 開始抽籤</button></div>
          </div>`;
        return;
      }
      const done = s.seen.filter(Boolean).length;
      app.innerHTML = `
        <h1>點自己的名字抽小主人</h1>
        <p class="lead">一次一個人看畫面，看完按「我記住了」再交給下一位。</p>
        <div class="card">
          <div class="progress">已抽 <b>${done}</b> / ${N} 人</div>
          <div class="who">
            ${s.names.map((n, i) => `<button class="${s.seen[i] ? 'done' : ''}" onclick="App.open(${i})">${esc(n)}</button>`).join('')}
          </div>
          ${done === N ? `<p class="note">🎉 全部抽完了！忘記的人可以點自己的名字再看一次。</p>` : ''}
        </div>
        ${s.showing !== null ? revealHtml(s.showing) : ''}`;
    }

    function revealHtml(i) {
      return `
        <div class="reveal">
          <div class="box">
            <div class="hi">${esc(s.names[i])}，你的小主人是</div>
            ${s.opened
              ? `<div class="envelope open"><div class="label">小主人</div><div class="name">${esc(s.names[s.target[i]])}</div></div>
                 <p class="tip">記好了嗎？不要讓任何人知道喔 🤫</p>
                 <button class="primary big" onclick="App.close()">我記住了，交給下一位</button>`
              : `<div class="envelope" onclick="App.flip()"><div class="q">?</div><div class="label">點一下打開</div></div>
                 <p class="tip">確認旁邊沒人在偷看</p>
                 <button class="ghost" style="color:#fff;border-color:rgba(255,255,255,.4)" onclick="App.close()">不是我，返回</button>`}
          </div>
        </div>`;
    }

    window.App = {
      setName(i, v) { s.names[i] = v; error = ''; save(); },   // no re-render: keeps Chinese IME input intact
      start() {
        const names = s.names.map((n) => n.trim());
        if (names.some((n) => !n)) { error = '請填滿 8 個名字'; render(); return; }
        if (new Set(names).size !== N) { error = '有重複的名字，請修改'; render(); return; }
        s.names = names; s.target = derange(N); s.seen = Array(N).fill(false); s.showing = null; s.opened = false;
        save(); render();
      },
      open(i) {
        if (s.seen[i] && !confirm(`${s.names[i]} 已經抽過了，確定是本人要再看一次嗎？`)) return;
        s.showing = i; s.opened = false; save(); render();
      },
      flip() { s.opened = true; s.seen[s.showing] = true; save(); render(); },
      close() { s.showing = null; s.opened = false; save(); render(); },
      reset() {
        if (!confirm('確定要清除名單和抽籤結果，重新開始嗎？')) return;
        s = fresh(); error = ''; save(); render();
      },
    };

    render();
  })();
  </script>
</body>
</html>
